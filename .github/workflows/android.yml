name: MeshScout Android CI
on:
  push:
  pull_request:
concurrency:
  group: meshscout-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android scaffolding while preserving owned sources
        run: |
          cp -R android/app/src/main/res/xml /tmp/meshscout-xml
          cp -R android/app/src/main/kotlin /tmp/meshscout-kotlin
          cp android/app/src/main/AndroidManifest.xml /tmp/meshscout-manifest.xml
          cp android/app/build.gradle.kts /tmp/meshscout-app.gradle.kts
          cp android/settings.gradle.kts /tmp/meshscout-settings.gradle.kts
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/meshscout-wrapper.properties
          cp pubspec.yaml /tmp/meshscout-pubspec.yaml
          cp pubspec.lock /tmp/meshscout-pubspec.lock
          cp analysis_options.yaml /tmp/meshscout-analysis.yaml
          flutter create --platforms=android --org org.meshscout --project-name mesh_scout --no-pub .
          cp -R /tmp/meshscout-kotlin/. android/app/src/main/kotlin/
          mkdir -p android/app/src/main/res/xml
          cp -R /tmp/meshscout-xml/. android/app/src/main/res/xml/
          cp /tmp/meshscout-manifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/meshscout-app.gradle.kts android/app/build.gradle.kts
          cp /tmp/meshscout-settings.gradle.kts android/settings.gradle.kts
          cp /tmp/meshscout-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp /tmp/meshscout-pubspec.yaml pubspec.yaml
          cp /tmp/meshscout-pubspec.lock pubspec.lock
          cp /tmp/meshscout-analysis.yaml analysis_options.yaml
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --timeout 2m
      - name: Build installable debug APK with persistent test signing
        env:
          MESHSCOUT_TEST_KEYSTORE_BASE64: ${{ secrets.MESHSCOUT_TEST_KEYSTORE_BASE64 }}
          MESHSCOUT_TEST_KEYSTORE_PASSWORD: ${{ secrets.MESHSCOUT_TEST_KEYSTORE_PASSWORD }}
        run: |
          test -n "$MESHSCOUT_TEST_KEYSTORE_BASE64"
          export MESHSCOUT_TEST_KEYSTORE_PATH="$RUNNER_TEMP/meshscout-test.p12"
          printf '%s' "$MESHSCOUT_TEST_KEYSTORE_BASE64" | base64 --decode > "$MESHSCOUT_TEST_KEYSTORE_PATH"
          chmod 600 "$MESHSCOUT_TEST_KEYSTORE_PATH"
          flutter build apk --debug
          rm -f "$MESHSCOUT_TEST_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: meshscout-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: meshscout-test-coverage
          path: coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-sources
          path: |
            lib/
            test/
            pubspec.lock
