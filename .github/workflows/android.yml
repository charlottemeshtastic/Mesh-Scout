name: MeshScout Android CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      production:
        description: Build with owner-controlled production signing
        type: boolean
        default: false
concurrency:
  group: meshscout-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android scaffolding while preserving owned sources
        run: |
          cp -R android/app/src/main/res/xml /tmp/meshscout-xml
          cp -R android/app/src/main/kotlin /tmp/meshscout-kotlin
          cp android/app/src/main/AndroidManifest.xml /tmp/meshscout-manifest.xml
          cp android/app/build.gradle.kts /tmp/meshscout-app.gradle.kts
          cp android/settings.gradle.kts /tmp/meshscout-settings.gradle.kts
          cp android/gradle/wrapper/gradle-wrapper.properties /tmp/meshscout-wrapper.properties
          cp pubspec.yaml /tmp/meshscout-pubspec.yaml
          cp pubspec.lock /tmp/meshscout-pubspec.lock
          cp analysis_options.yaml /tmp/meshscout-analysis.yaml
          flutter create --platforms=android --org org.meshscout --project-name mesh_scout --no-pub .
          cp -R /tmp/meshscout-kotlin/. android/app/src/main/kotlin/
          mkdir -p android/app/src/main/res/xml
          cp -R /tmp/meshscout-xml/. android/app/src/main/res/xml/
          cp /tmp/meshscout-manifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/meshscout-app.gradle.kts android/app/build.gradle.kts
          cp /tmp/meshscout-settings.gradle.kts android/settings.gradle.kts
          cp /tmp/meshscout-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp /tmp/meshscout-pubspec.yaml pubspec.yaml
          cp /tmp/meshscout-pubspec.lock pubspec.lock
          cp /tmp/meshscout-analysis.yaml analysis_options.yaml
          git diff --exit-code -- lib test pubspec.yaml pubspec.lock analysis_options.yaml android/app/build.gradle.kts android/app/src/main/AndroidManifest.xml android/app/src/main/kotlin android/app/src/main/res/xml
      - run: flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        id: format
        run: |
          dart format lib test
          if ! git diff --quiet -- lib test; then
            for f in $(git diff --name-only -- lib test); do
              body=$(git diff -U0 -- "$f" | tail -n +5 | head -c 3500 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error file=$f,title=dart format::$body"
            done
            exit 1
          fi
      - run: flutter analyze --fatal-infos
        if: ${{ !cancelled() }}
      - run: flutter test --coverage --timeout 2m --reporter github
        if: ${{ !cancelled() }}
      - name: Build optimized APK candidate with persistent test signing
        env:
          MESHSCOUT_TEST_KEYSTORE_BASE64: ${{ secrets.MESHSCOUT_TEST_KEYSTORE_BASE64 }}
          MESHSCOUT_TEST_KEYSTORE_PASSWORD: ${{ secrets.MESHSCOUT_TEST_KEYSTORE_PASSWORD }}
        run: |
          test -n "$MESHSCOUT_TEST_KEYSTORE_BASE64"
          export MESHSCOUT_TEST_KEYSTORE_PATH="$RUNNER_TEMP/meshscout-test.p12"
          printf '%s' "$MESHSCOUT_TEST_KEYSTORE_BASE64" | base64 --decode > "$MESHSCOUT_TEST_KEYSTORE_PATH"
          chmod 600 "$MESHSCOUT_TEST_KEYSTORE_PATH"
          export MESHSCOUT_CANDIDATE=true
          flutter build apk --release
          mkdir -p candidate
          cp build/app/outputs/flutter-apk/app-release.apk candidate/MeshScout-candidate.apk
          rm -f "$MESHSCOUT_TEST_KEYSTORE_PATH"
      - name: Build production APK and app bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
        env:
          MESHSCOUT_RELEASE_KEYSTORE_BASE64: ${{ secrets.MESHSCOUT_RELEASE_KEYSTORE_BASE64 }}
          MESHSCOUT_RELEASE_STORE_PASSWORD: ${{ secrets.MESHSCOUT_RELEASE_STORE_PASSWORD }}
          MESHSCOUT_RELEASE_KEY_ALIAS: ${{ secrets.MESHSCOUT_RELEASE_KEY_ALIAS }}
          MESHSCOUT_RELEASE_KEY_PASSWORD: ${{ secrets.MESHSCOUT_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$MESHSCOUT_RELEASE_KEYSTORE_BASE64"
          test -n "$MESHSCOUT_RELEASE_STORE_PASSWORD"
          test -n "$MESHSCOUT_RELEASE_KEY_ALIAS"
          test -n "$MESHSCOUT_RELEASE_KEY_PASSWORD"
          export MESHSCOUT_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/meshscout-production.p12"
          trap 'rm -f "$MESHSCOUT_RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$MESHSCOUT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$MESHSCOUT_RELEASE_KEYSTORE_PATH"
          chmod 600 "$MESHSCOUT_RELEASE_KEYSTORE_PATH"
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p production
          cp build/app/outputs/flutter-apk/app-release.apk production/MeshScout-production.apk
          cp build/app/outputs/bundle/release/app-release.aab production/MeshScout-production.aab
      - name: Verify native backup authentication
        run: cd android && ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: meshscout-candidate-apk
          path: candidate/MeshScout-candidate.apk
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.production }}
        with:
          name: meshscout-production
          path: production/
      - uses: actions/upload-artifact@v4
        with:
          name: meshscout-test-coverage
          path: coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validated-sources
          path: |
            lib/
            test/
            pubspec.lock
