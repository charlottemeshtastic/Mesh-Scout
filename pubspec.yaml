name: mesh_scout
description: Independent MeshCore coverage mapping app
publish_to: none
version: 1.5.0+18
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.3
  crypto: ^3.0.6
  flutter_riverpod: ^3.0.0
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  flutter_map: ^8.0.0
  flutter_map_vector_tiles: 2.9.1
  latlong2: ^0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/meshscout-logo.jpg
    - assets/licenses/MeshMapper-MIT.txt
